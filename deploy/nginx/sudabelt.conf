# =============================================================================
# Sudabelt Medical - Production Nginx Configuration for Hostinger VPS
# Install to: /etc/nginx/sites-available/sudabelt.com
# Enable via: sudo ln -s /etc/nginx/sites-available/sudabelt.com /etc/nginx/sites-enabled/
# Test & reload: sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# 1. Redirect HTTP -> HTTPS (canonical www.sudabelt.com)
server {
    listen 80;
    listen [::]:80;
    server_name sudabelt.com www.sudabelt.com;
    return 301 https://www.sudabelt.com$request_uri;
}

# 2. Redirect apex HTTPS (sudabelt.com) -> canonical https://www.sudabelt.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sudabelt.com;

    ssl_certificate /etc/letsencrypt/live/sudabelt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sudabelt.com/privkey.pem;

    return 301 https://www.sudabelt.com$request_uri;
}

# 3. Primary Production Server (Frontend Static + Backend API + 301 Redirects)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sudabelt.com;

    ssl_certificate /etc/letsencrypt/live/sudabelt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sudabelt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Built React 19 Frontend Directory (copy client/dist here)
    root /var/www/sudabelt/client/dist;
    index index.html;

    client_max_body_size 50M;

    # -------------------------------------------------------------------------
    # A. Backend Express API & Uploads Reverse Proxy (Docker/Node on port 5000)
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------------------------
    # B. Webflow-to-React 301 Permanent Redirect Matrix
    # -------------------------------------------------------------------------
    location = /about-us { return 301 /about; }
    location = /contact-us { return 301 /contact; }
    location = /career { return 301 /careers; }
    location = /services { return 301 /services/turnkey; }
    location = /media { return 301 /projects; }
    location = /product { return 301 /products; }
    location ^~ /our-products { return 301 /products; }
    location = /after-sale-support { return 301 /support/after-sales; }
    location = /medical-training { return 301 /training-hub; }
    location = /term-of-use { return 301 /terms-of-use; }
    location = /site-map { return 301 /sitemap; }

    # Legacy Blog Taxonomies & Removed Template Post
    location = /categories { return 301 /blog; }
    location ^~ /categories/ { return 301 /blog; }
    location ^~ /tags/ { return 301 /blog; }
    location ^~ /authors/ { return 301 /blog; }
    location = /blog/from-top-down { return 301 /blog; }

    # Exact Legacy Product URLs -> New Product Detail Pages
    location = /logic-e10 { return 301 /products/imaging-and-life-care/ge-logiq-e10-ultrasound-system; }
    location = /vivid-e95 { return 301 /products/imaging-and-life-care/ge-vivid-e95; }
    location = /carescape { return 301 /products/imaging-and-life-care/ge-carescape-b650-patient-monitor; }
    location = /spectra-optia { return 301 /products/blood-management-cell-technologies/terumo-spectra-optia-apheresis-system; }
    location = /trima { return 301 /products/blood-management-cell-technologies/terumo-trima-accel-automated-blood-collection; }
    location = /reveos { return 301 /products/blood-management-cell-technologies/terumo-reveos-automated-blood-processing; }
    location = /mirasol { return 301 /products/blood-management-cell-technologies/terumo-mirasol-prt-system; }
    location = /baxter-ak98 { return 301 /products/renal-and-critical-care/baxter-ak98; }
    location = /mr850-heated-humidifier { return 301 /products/respiratory-and-neonatal-care/fp-mr850-heated-humidifier; }
    location = /airvo-tm-2-nasal-high-flow-system { return 301 /products/respiratory-and-neonatal-care/fp-airvo-2-high-flow-system; }

    # Legacy Category & Device Pages -> New Filtered Portfolio Categories
    location ~ ^/(ultrasound|imaging|monitoring|maternal|diagnostic|cardiology|anesthesia|b105|g-incubator|lullaby|lullaby-led|mac-600|mac-800|mac-2000|cardioday-seer-1000|cardiosoft-t2100|case-t2100|carestation-30|carestation-650|9100cnxt|carescape-r860|siaretron-4000-ventilator|versana-premier|versana-balance|versana-active|versana-essential|logiq-v2|logiq-f8|logiq-p7|logiq-p9|voluson-e10|voluson-p8|voluson-s8|voluson-s10|vivid-t8|vivid-t9|vivid-s70|v-scan-air|optima-tm-igs-330|optima-tm-igs-530|optima-tm-igs-730|signa-tm-creator|signa-tm-explorer-air|signa-tm-prime|revolution-tm-acts|revolution-act|revolution-tm-evo-gen-3|revolution-tm-maxima)$ {
        return 301 /products?category=imaging-and-life-care;
    }

    location ~ ^/(renal|baxter-consumables)$ {
        return 301 /products?category=renal-and-critical-care;
    }

    location ~ ^/(blood-separation|terumo-consumables)$ {
        return 301 /products?category=blood-management-cell-technologies;
    }

    location ~ ^/(laboratory|abbott-architect-c4000|abbott-architect-i1000|abbott-emerald-22-open-tube-ot|immunoassay-consumables|immunoassay-calibrators|immunoassay-reagent|clinical-chemistry-reagents|clinical-chemistry-consumables|clinical-chemistry-calibrators-and-controls)$ {
        return 301 /products?category=laboratory-and-diagnostics;
    }

    location ~ ^/(respiratory|humidifier|breathing-circuits|chambers|bubble-cpap-system|f-p-850-system-for-optiflow-tm|f-p-850-breathing-circuit-kits|inspiratory-expiratory-breathing|optiflow-tm-junior-breathing-circuit|rt302-kit|rt332-kit|f-p-visairo-tm-rt075|f-p-visairo-tm-rt076|f-p-visairo-tm-rt077|freemotion-tm-rt040|freemotion-tm-rt041)$ {
        return 301 /products?category=respiratory-and-neonatal-care;
    }

    # -------------------------------------------------------------------------
    # C. Static Assets & AI/SEO Discovery Files
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* ^/(robots\.txt|llms\.txt|sitemap\.xml)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # -------------------------------------------------------------------------
    # D. React 19 Single-Page Application Fallback
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
