services:
  sudabelt-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sudabelt-api
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - sudabelt_uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  sudabelt_uploads:
