# fly.toml app configuration file generated for sudabelt-api on 2026-11-24T12:57:53+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'sudabelt-api'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '5000'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
